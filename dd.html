<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Chandani Bhattarai Portfolio</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
      rel="stylesheet"
    />

    <style>
      /* ===============================
   GLOBAL
=============================== */

      body {
        margin: 0;
        font-family: Roboto;
        overflow-x: hidden;
        cursor: none;

        background: linear-gradient(135deg, #e0bbe4, #957dad, #d291bc, #e0bbe4);

        background-size: 400% 400%;
        animation: bgMove 20s infinite ease;
        color: white;
      }

      @keyframes bgMove {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      /* ===============================
   RAINBOW CANVAS
=============================== */

      #rainbowCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      }

      /* ===============================
   CURSOR
=============================== */

      .cursor {
        position: fixed;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: linear-gradient(45deg, #fff, #d291bc);
        pointer-events: none;
        z-index: 9999;
      }

      /* ===============================
   NAVBAR
=============================== */

      .navbar {
        position: fixed;
        top: 0;
        width: 100%;
        padding: 15px 40px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        z-index: 1000;
      }

      .navbar h1 {
        margin: 0;
        font-size: 24px;
      }

      /* ===============================
   HERO
=============================== */

      .hero {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 5;
      }

      .hero-content {
        text-align: center;
      }

      .hero img {
        width: 200px;
        border-radius: 50%;
        margin-bottom: 20px;
      }

      /* ===============================
   ROBOT
=============================== */

      #interactive-hero {
        position: absolute;
        right: 10%;
        top: 20%;
        width: 200px;
        height: 200px;
        z-index: 20;
      }

      #robot-head {
        position: absolute;
        top: 20px;
        left: 60px;
        width: 80px;
        height: 80px;
      }

      .eye {
        position: absolute;
        width: 30px;
        height: 30px;
        background: white;
        border-radius: 50%;
        border: 2px solid black;
        overflow: hidden;
      }

      .eye.left {
        left: 0;
      }
      .eye.right {
        right: 0;
      }

      .pupil {
        width: 12px;
        height: 12px;
        background: black;
        border-radius: 50%;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        transition: transform 0.08s linear;
      }

      #ball {
        position: absolute;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, white, #d291bc);
        box-shadow: 0 0 20px #d291bc;
      }

      /* ===============================
   SECTIONS
=============================== */

      .section {
        padding: 100px 20px;
        position: relative;
        z-index: 5;
      }

      .container {
        max-width: 1000px;
        margin: auto;
      }

      .skill {
        display: inline-block;
        padding: 10px 20px;
        margin: 10px;
        background: #d291bc;
        border-radius: 20px;
      }
    </style>
  </head>

  <body>
    <canvas id="rainbowCanvas"></canvas>

    <div class="cursor"></div>

    <div class="navbar">
      <h1>Chandani Bhattarai</h1>
    </div>

    <div class="hero" id="home">
      <div class="hero-content">
        <img src="profile.jpeg" />

        <h1>Chandani Bhattarai</h1>
        <h3>Full Stack Developer</h3>
      </div>

      <div id="interactive-hero">
        <div id="robot-head">
          <div class="eye left">
            <div class="pupil"></div>
          </div>

          <div class="eye right">
            <div class="pupil"></div>
          </div>
        </div>

        <div id="ball"></div>
      </div>
    </div>

    <div class="section">
      <div class="container">
        <h2>About Me</h2>

        <p>
          Full stack developer specializing in Laravel, Vue, AWS, and scalable
          web applications.
        </p>
      </div>
    </div>

    <div class="section">
      <div class="container">
        <h2>Skills</h2>

        <div class="skill">HTML</div>
        <div class="skill">CSS</div>
        <div class="skill">JavaScript</div>
        <div class="skill">Laravel</div>
        <div class="skill">Vue</div>
        <div class="skill">AWS</div>
      </div>
    </div>

    <script>
      /* ============================
CURSOR
============================ */

      const cursor = document.querySelector(".cursor");

      document.addEventListener("mousemove", (e) => {
        cursor.style.left = e.clientX + "px";
        cursor.style.top = e.clientY + "px";
      });

      /* ============================
RAINBOW FLUID
============================ */

      const canvas = document.getElementById("rainbowCanvas");
      const ctx = canvas.getContext("2d");

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      let particles = [];
      let mouse = { x: 0, y: 0 };

      class Particle {
        constructor(x, y) {
          this.x = x;
          this.y = y;

          this.size = Math.random() * 10 + 5;

          this.life = 1;

          this.decay = Math.random() * 0.02 + 0.01;

          this.hue = Math.random() * 360;

          this.vx = (Math.random() - 0.5) * 2;
          this.vy = (Math.random() - 0.5) * 2;
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;

          this.life -= this.decay;
        }

        draw() {
          ctx.beginPath();

          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);

          ctx.fillStyle = `hsla(${this.hue},100%,60%,${this.life})`;

          ctx.fill();
        }
      }

      document.addEventListener("mousemove", (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;

        for (let i = 0; i < 4; i++) {
          particles.push(new Particle(mouse.x, mouse.y));
        }
      });

      function animate() {
        ctx.fillStyle = "rgba(255,255,255,0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        particles.forEach((p, i) => {
          p.update();
          p.draw();

          if (p.life <= 0) {
            particles.splice(i, 1);
          }
        });

        requestAnimationFrame(animate);
      }

      animate();

      /* ============================
ROBOT BALL SMOOTH
============================ */

      const ball = document.getElementById("ball");

      let ballX = 80;
      let ballY = 80;

      let targetX = 80;
      let targetY = 80;

      function ballAnimate() {
        ballX += (targetX - ballX) * 0.08;
        ballY += (targetY - ballY) * 0.08;

        ball.style.transform = `translate(${ballX}px,${ballY}px)`;

        requestAnimationFrame(ballAnimate);
      }

      ballAnimate();

      document.getElementById("home").addEventListener("mousemove", (e) => {
        const rect = document
          .getElementById("interactive-hero")
          .getBoundingClientRect();

        targetX = e.clientX - rect.left;
        targetY = e.clientY - rect.top;

        const head = document
          .getElementById("robot-head")
          .getBoundingClientRect();

        const eyeX = head.left + head.width / 2;
        const eyeY = head.top + head.height / 2;

        const dx = e.clientX - eyeX;
        const dy = e.clientY - eyeY;

        const angle = Math.atan2(dy, dx);

        const dist = Math.min(6, Math.sqrt(dx * dx + dy * dy) / 30);

        const px = Math.cos(angle) * dist;
        const py = Math.sin(angle) * dist;

        document.querySelectorAll(".pupil").forEach((p) => {
          p.style.transform = `translate(calc(-50% + ${px}px),
calc(-50% + ${py}px))`;
        });
      });
    </script>
  </body>
</html>
